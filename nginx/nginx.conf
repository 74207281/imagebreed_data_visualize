events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Enable gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Increase maximum upload file size (essential for large CSV dataset uploads)
    client_max_body_size 100M;

    upstream data_visualize_backend {
        server agriplot-vision:8000;
    }

    # Upstream for your other service running at "/"
    # upstream main_service {
    #     server my-other-container:3000;
    # }

    server {
        listen 80;
        server_name localhost;

        # -------------------------------------------------------------
        # 1. Your existing service running at root "/"
        # -------------------------------------------------------------
        location / {
            # Replace with your other service's proxy_pass, for example:
            # proxy_pass http://main_service;
            # proxy_set_header Host $http_host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_set_header X-Forwarded-Proto $scheme;

            return 200 "Existing service running at / (replace this block with your primary service proxy_pass)\n";
            add_header Content-Type text/plain;
        }

        # -------------------------------------------------------------
        # 2. Redirect without trailing slash (uses $http_host to preserve port e.g. :70)
        # -------------------------------------------------------------
        location = /data_visualize {
            return 301 $scheme://$http_host/data_visualize/;
        }

        # Also redirect previous spelling variants
        location = /data_visulization {
            return 301 $scheme://$http_host/data_visualize/;
        }
        location /data_visulization/ {
            return 301 $scheme://$http_host/data_visualize/;
        }

        # -------------------------------------------------------------
        # 3. Data Visualization App routed on /data_visualize/
        # -------------------------------------------------------------
        location /data_visualize/ {
            # Trailing slash is critical: strips "/data_visualize/" before forwarding to FastAPI
            proxy_pass http://data_visualize_backend/;
            proxy_http_version 1.1;

            # WebSocket and connection upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Pass client and host information (using $http_host preserves port :70)
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /data_visualize;

            # Timeouts for heavy computation (correlation matrices, heatmaps)
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
