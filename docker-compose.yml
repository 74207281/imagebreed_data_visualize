services:
  agriplot-vision:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriplot-vision
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ROOT_PATH=/data_visualize

  nginx:
    image: nginx:alpine
    container_name: agriplot-nginx
    restart: unless-stopped
    ports:
      - "70:80"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - agriplot-vision
